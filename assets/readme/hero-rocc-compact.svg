<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Rocc 创作工作台 — 让想法，有作品。</title>
  <desc id="desc">橙、白、深灰和黄色组成的个人创作桌面。影像画幅、文字稿和选题便签叠放，表达影像制作、内容归档、灵感研究与多平台表达的建设方向。能力状态以 README 正文为准。</desc>
  <defs>
    <pattern id="media-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V8" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="2"/></pattern>
  </defs>
  <rect width="1200" height="680" fill="#FFFFFF"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g id="brand">
      <rect x="48" y="42" width="24" height="24" rx="3" fill="#FF5B12"/>
      <path d="M54 48h12v12H54z" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <text x="84" y="61" font-size="19" font-weight="650" letter-spacing="2" fill="#222222">ROCC / CREATIVE WORKSPACE</text>
      <text x="1152" y="61" text-anchor="end" font-size="18" fill="#626262" letter-spacing="2">PERSONAL STUDIO</text>
      <path d="M48 88H1152" stroke="#E8E8E8"/>
    </g>
    <g id="editorial-title">
      <text x="48" y="209" font-size="104" font-weight="800" letter-spacing="-6" fill="#111111">ROCC</text>
      <text x="52" y="285" font-size="58" font-weight="750" letter-spacing="-2" fill="#222222">创作工作台</text>
      <rect x="48" y="320" width="413" height="72" rx="4" fill="#FF5B12"/>
      <text x="66" y="371" font-size="43" font-weight="700" fill="#FFFFFF">让想法，有作品。</text>
      <text x="52" y="445" font-size="25" fill="#555555">影像、文字、灵感与表达。</text>
      <text x="52" y="484" font-size="25" fill="#555555">在同一个工作空间里生长。</text>
      <g transform="translate(52 532)" font-size="20" font-weight="600" fill="#222222">
        <text x="0" y="0">抖音</text><circle cx="62" cy="-7" r="2" fill="#FF5B12"/>
        <text x="82" y="0">小红书</text><circle cx="165" cy="-7" r="2" fill="#FF5B12"/>
        <text x="185" y="0">X</text>
      </g>
    </g>
    <g id="desk-background">
